# ClinicalHistory chart schema for the chart-section asker (src/ddx_genie/chart_asker.py).
#
# Single source of truth. `python -m ddx_genie.chart_asker --write-spec` turns it into the
# 14-column Genie spec CSV (specs/clinical_history.csv), and the asker builds its live
# worksheet by loading that CSV with Genie's own `csv_to_classes`.
#
# Ported from demo/chart_sections.yaml (same sections and fields, same descriptions) with
# one addition: a fixed patient-facing `question` per field. Both policies ask a field's
# question verbatim, so the checklist and differential arms differ ONLY in which field
# they pick, not in how the question is worded.
#
# - section/field `name`: Python identifier; keys look like "HPI.onset"
# - description: what counts as filling the field. The tagger sees it, so it is
#                effectively the definition of "filled".
# - Section order is the checklist policy's order.
#
# Design rule (TODO_john.md step 1): fields and questions are tuned on the dev split only.

worksheet: ClinicalHistory

sections:
  - name: HPI
    title: History of present illness
    fields:
      - name: onset
        description: When the current problem began, or how it began (sudden or gradual).
        question: When did this problem start, and did it come on suddenly or gradually?
      - name: duration
        description: How long the problem has lasted, or how long each episode lasts.
        question: How long has it been going on, and how long does each episode last?
      - name: character
        description: Quality or nature of the main symptom (e.g. sharp, dull, productive cough, watery stool).
        question: Can you describe what the main symptom is like?
      - name: location
        description: Where on the body the symptom is, including radiation.
        question: Where exactly is it, and does it spread anywhere?
      - name: severity
        description: How bad the symptom is (scale, functional impact, progression).
        question: How severe is it, and has it been getting worse?
      - name: timing
        description: Pattern or frequency (constant, intermittent, nocturnal, after meals).
        question: Is it constant or does it come and go? Is there a pattern to when it happens?
      - name: aggravating_relieving
        description: Anything that makes it worse or better, including treatments tried.
        question: Does anything make it better or worse, including any treatment you have tried?
      - name: associated_symptoms
        description: Other symptoms occurring with the main complaint.
        question: Have you noticed any other symptoms along with it?

  - name: PMH
    title: Past medical history
    fields:
      - name: chronic_conditions
        description: Known chronic diseases or diagnoses (diabetes, HIV, hypertension, etc.).
        question: Do you have any ongoing medical conditions?
      - name: prior_episodes
        description: Previous episodes of a similar problem, prior hospitalizations, or pregnancies.
        question: Have you had anything like this before, or been hospitalized or pregnant before?
      - name: surgeries
        description: Past surgeries or procedures.
        question: Have you had any surgeries or procedures?

  - name: Medications
    title: Medications
    fields:
      - name: current_meds
        description: Medications, supplements, or contraception currently taken.
        question: What medications, supplements, or contraception do you take?
      - name: recent_changes
        description: Medications recently started, stopped, or changed, or recent vaccinations.
        question: Have you recently started, stopped, or changed any medication, or had any vaccinations?

  - name: Allergies
    title: Allergies
    fields:
      - name: allergies
        description: Drug or other allergies and the reaction type, or explicit 'no known allergies'.
        question: Do you have any allergies?

  - name: Social
    title: Social history
    fields:
      - name: smoking
        description: Tobacco use, amount, duration.
        question: Do you smoke or use tobacco?
      - name: alcohol
        description: Alcohol use and amount.
        question: Do you drink alcohol, and how much?
      - name: drugs
        description: Recreational or illicit drug use, including IV drug use.
        question: Do you use any recreational drugs?
      - name: occupation
        description: Job, occupational exposures, or living situation.
        question: What do you do for work, and what is your living situation?
      - name: travel
        description: Recent travel, camping, animal or environmental exposures.
        question: Have you travelled recently, or been exposed to animals, insects, or anything unusual?
      - name: sexual_history
        description: Sexual activity, partners, protection, STI history.
        question: Are you sexually active, and do you use protection?

  - name: Family
    title: Family history
    fields:
      - name: family_history
        description: Diseases in relatives, with age of onset when given.
        question: Does anyone in your family have any medical conditions?

  - name: ROS
    title: Review of systems
    fields:
      - name: ros_positives
        description: Symptoms present in other organ systems not already captured in HPI (e.g. fever, weight loss).
        question: Have you had any fever, weight change, or symptoms anywhere else in your body?
      - name: ros_negatives
        description: Symptoms explicitly denied (pertinent negatives).
        question: Are there symptoms you have specifically not had, such as fever, pain, or changes in appetite?

  - name: ExamLabs
    title: Exam / Labs
    fields:
      - name: vitals
        description: Temperature, blood pressure, pulse, respiratory rate, oxygen saturation, BMI.
        question: What are the vital signs (temperature, blood pressure, pulse, breathing rate, oxygen level)?
      - name: exam_findings
        description: Physical examination findings.
        question: What does the physical examination show?
      - name: lab_results
        description: Laboratory, imaging, pathology, ECG, or other test results.
        question: What do the laboratory tests, imaging, or other investigations show?
